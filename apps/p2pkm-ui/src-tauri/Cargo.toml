[workspace]

[package]
name = "p2pkm-ui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
rtrb = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4"] }
p2pkm-proto = { path = "../../../crates/p2pkm-proto" }
p2pkm-hal = { path = "../../../crates/p2pkm-hal" }
p2pkm-engine = { path = "../../../crates/p2pkm-engine" }
p2pkm-net = { path = "../../../crates/p2pkm-net" }
