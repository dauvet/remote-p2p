[workspace]
resolver = "2"
members = [
    "crates/p2pkm-proto",
    "crates/p2pkm-hal",
    "crates/p2pkm-engine",
    "crates/p2pkm-net",
    "crates/p2pkm-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["remote-p2p contributors"]

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rtrb = "0.3"
uuid = { version = "1.11", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
bytes = "1.8"
